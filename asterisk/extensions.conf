; =============================================================
; Asterisk Dialplan
; Contexts: from-webrtc (outbound), from-iagu (inbound)
; Copy to /etc/asterisk/extensions.conf and reload dialplan.
; =============================================================


; =============================================================
; OUTBOUND: Browser consultant dials a phone number
;
; Flow: Browser (SIP.js) -> Asterisk -> Iagu trunk -> PSTN
;
; Caller ID comes from frontend dropdown via SIP header:
;   X-Outgoing-Number: 02901784xx
; If invalid or missing, fallback to 0290178400.
; Iagu rule: must end in 84xx, otherwise overstamped.
; =============================================================

[from-webrtc]

exten => _X.,1,NoOp(Outbound from ${CALLERID(num)} to ${EXTEN})
 same => n,Set(SELECTED_OUTGOING=${PJSIP_HEADER(read,X-Outgoing-Number)})
 same => n,NoOp(Selected outgoing header: ${SELECTED_OUTGOING})
 same => n,GotoIf($[${REGEX("^02901784[0-9][0-9]$" ${SELECTED_OUTGOING})}]?use_selected:use_default)
 same => n(use_selected),Set(CALLERID(num)=${SELECTED_OUTGOING})
 same => n,Goto(after_callerid)
 same => n(use_default),Set(CALLERID(num)=0290178400)
 same => n(after_callerid),NoOp(Using caller ID: ${CALLERID(num)})
 ; Convert dialed number to AU international/local format Iagu expects:
 ; - already starts with 0011  -> leave as-is (already AU intl prefix)
 ; - already starts with +      -> strip + and prepend 0011
 ; - starts with 0 and 10 digits -> AU local, leave as-is
 ; - otherwise (assumed intl)   -> prepend 0011
 same => n,Set(DIALED=${EXTEN})
 same => n,GotoIf($[${REGEX("^0011" ${DIALED})}]?dial)
 same => n,GotoIf($[${REGEX("^\\+" ${DIALED})}]?intl_plus)
 same => n,GotoIf($[${REGEX("^0[0-9]{9}$" ${DIALED})}]?dial)
 same => n,Set(DIALED=0011${DIALED})
 same => n,Goto(dial)
 same => n(intl_plus),Set(DIALED=0011${DIALED:1})
 same => n(dial),NoOp(Dialing: ${DIALED} via iagu-trunk)
 ; --- Recording: capture audio to /var/spool/asterisk/monitor/<file>.wav
 ; File name pattern: YYYYMMDD-HHMMSS_<uniqueid>_out_<callerid>_<dialed>.wav
 same => n,Set(REC_FILE=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}_${UNIQUEID}_out_${CALLERID(num)}_${DIALED}.wav)
 same => n,NoOp(Recording to: ${REC_FILE})
 same => n,MixMonitor(${REC_FILE},b)
 same => n,Dial(PJSIP/${DIALED}@iagu-trunk,45)
 same => n,Hangup()


; =============================================================
; INBOUND: Iagu delivers a call to our Asterisk
;
; Flow: PSTN -> Iagu -> Asterisk -> Browser (SIP.js)
;
; FORMAT-AGNOSTIC matching: Iagu may send any of these formats:
;   0290178400        (national 10-digit)
;   612901784XX       (E.164 without +)
;   +612901784XX      (E.164 with +)
;   901784XX          (8-digit local, no area code)
;
; Whatever format arrives, we normalize to canonical 02901784XX,
; validate it falls in the 8400-8499 block, then route to venus.
;
; DND is checked via Asterisk internal DB.
; When DND is active, caller hears busy tone.
; =============================================================

[from-iagu]

; --- Entry 1: starts with a digit (0290..., 6129..., 9017...) ---
exten => _X.,1,Goto(normalize,1)

; --- Entry 2: starts with literal '+' (E.164 with plus) ---
exten => _+X.,1,Goto(normalize,1)

; --- Shared normalization + routing ---
exten => normalize,1,NoOp(Inbound raw DID = ${EXTEN} from ${CALLERID(num)})
 same => n,Set(NORM=${EXTEN})
 ; "+61..." -> drop "+61", prepend "0"
 same => n,GotoIf($[${REGEX("^\\+61" ${NORM})}]?strip_plus61)
 ; "61..." -> drop "61", prepend "0"
 same => n,GotoIf($[${REGEX("^61" ${NORM})}]?strip_61)
 ; "0..." -> already national, validate as-is
 same => n,GotoIf($[${REGEX("^0" ${NORM})}]?validate)
 ; otherwise treat as 8-digit local without area code -> prepend "02"
 same => n,Set(NORM=02${NORM})
 same => n,Goto(validate)
 same => n(strip_plus61),Set(NORM=0${NORM:3})
 same => n,Goto(validate)
 same => n(strip_61),Set(NORM=0${NORM:2})
 same => n(validate),NoOp(Normalized DID = ${NORM})
 same => n,GotoIf($[${REGEX("^02901784[0-9][0-9]$" ${NORM})}]?route:reject)
 same => n(route),NoOp(Routing ${NORM} to venus)
 same => n,Set(CONSULTANT=venus)
 same => n,GoSub(check-dnd,s,1)
 same => n,Set(REC_FILE=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}_${UNIQUEID}_in_${CALLERID(num)}_${NORM}.wav)
 same => n,NoOp(Recording to: ${REC_FILE})
 same => n,MixMonitor(${REC_FILE},b)
 same => n,Dial(PJSIP/${CONSULTANT},30)
 same => n,Hangup()
 same => n(reject),NoOp(Unknown DID raw=${EXTEN} normalized=${NORM} - rejecting)
 same => n,Congestion(5)
 same => n,Hangup()


; =============================================================
; SUBROUTINE: check-dnd
;
; Checks Asterisk internal DB for dnd/<consultant> = 1.
; If DND is active, plays busy and hangs up.
; Otherwise returns to the calling context to continue.
;
; The frontend sets DND via the backend API.
; The deploy script or an AGI hook syncs it to Asterisk DB.
; =============================================================

[check-dnd]

exten => s,1,NoOp(Checking DND for ${CONSULTANT})
 same => n,GotoIf($[${DB_EXISTS(dnd/${CONSULTANT})}]?has_key:no_dnd)
 same => n(has_key),GotoIf($["${DB(dnd/${CONSULTANT})}" = "1"]?is_dnd:no_dnd)
 same => n(is_dnd),NoOp(DND active for ${CONSULTANT})
 same => n,Busy(5)
 same => n,Hangup()
 same => n(no_dnd),Return()
