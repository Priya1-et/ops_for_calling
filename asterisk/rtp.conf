; =============================================================
; RTP Configuration
; Media port range and NAT traversal settings.
; Copy to /etc/asterisk/rtp.conf and restart Asterisk.
;
; Replace ${PUBLIC_IP} with your real public IP before use.
; =============================================================

[general]
rtpstart=10000
rtpend=20000
icesupport=true
stunaddr=stun.l.google.com:19302
externaddr=${PUBLIC_IP}
