; =============================================================
; Asterisk HTTP Server Configuration
; Enables WebSocket (WS) and Secure WebSocket (WSS) for SIP.js
; Copy to /etc/asterisk/http.conf and restart Asterisk.
; =============================================================

[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8087

; TLS for secure WebSocket (wss://) on port 8089
; Requires self-signed cert: /etc/asterisk/tls/asterisk.crt
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/tls/asterisk.crt
tlsprivatekey=/etc/asterisk/tls/asterisk.key
