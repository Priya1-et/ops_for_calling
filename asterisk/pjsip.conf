; =============================================================
; PJSIP Configuration
; Supports: local WebRTC testing + Iagu SIP trunk (production)
; Copy to /etc/asterisk/pjsip.conf and restart Asterisk.
; =============================================================

[global]
type=global
user_agent=WebCallingAsterisk


; =============================================================
; TRANSPORTS
; =============================================================

; Plain WebSocket — local testing only (no TLS cert needed)
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0
local_net=127.0.0.0/8
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

; Secure WebSocket — browser connections with self-signed cert
; Requires: /etc/asterisk/tls/asterisk.crt and asterisk.key
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0
cert_file=/etc/asterisk/tls/asterisk.crt
priv_key_file=/etc/asterisk/tls/asterisk.key
local_net=127.0.0.0/8
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16
external_media_address=${PUBLIC_IP}
external_signaling_address=${PUBLIC_IP}

; UDP — SIP trunk communication with Iagu
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0
external_media_address=${PUBLIC_IP}
external_signaling_address=${PUBLIC_IP}


; =============================================================
; IAGU SIP TRUNK (IP-based authentication, no password)
;
; Andrew confirmed: Iagu accepts trunk via static IP allowlist.
; Replace ${PUBLIC_IP} with your real IP before use.
; Iagu host: iagu.net (preferred, requires DNS SRV support)
; Alternatives: trunk.iagu.net, sip.iagu.net
; =============================================================

[iagu-trunk]
type=endpoint
transport=transport-udp
context=from-iagu
disallow=all
allow=ulaw
allow=alaw
from_domain=iagu.net
direct_media=no
ice_support=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
aors=iagu-trunk

[iagu-trunk]
type=aor
contact=sip:iagu.net

[iagu-trunk]
type=identify
endpoint=iagu-trunk
match=iagu.net


; =============================================================
; CONSULTANT: venus (production)
;
; Uses WSS transport for browser WebRTC.
; Caller ID set to Australian format ending in 84xx
; so Iagu accepts it (overstamps to 02 9017 8400).
; =============================================================

[venus]
type=endpoint
transport=transport-wss
context=from-webrtc
disallow=all
allow=opus
allow=ulaw
webrtc=yes
dtls_auto_generate_cert=yes
dtls_verify=no
dtls_setup=actpass
media_encryption=dtls
ice_support=yes
media_use_received_transport=yes
rtcp_mux=yes
use_avpf=yes
rewrite_contact=yes
force_rport=yes
rtp_symmetric=yes
direct_media=no
aors=venus
auth=venus
callerid=Venus <0290178400>

[venus]
type=auth
auth_type=userpass
username=venus
password=Venus@2024!

[venus]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=30


