; PJSIP config: WebRTC browser users (local testing)
; Copy to /etc/asterisk/pjsip.conf and restart Asterisk.

[global]
type=global
user_agent=WebCallingAsterisk

; ---- Transports ----

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0
local_net=127.0.0.0/8
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

; ---- WebRTC browser user: kartik ----

[kartik]
type=endpoint
transport=transport-ws
context=from-webrtc
disallow=all
allow=ulaw
webrtc=yes
dtls_auto_generate_cert=yes
dtls_verify=no
dtls_setup=actpass
media_encryption=dtls
ice_support=yes
media_use_received_transport=yes
rtcp_mux=yes
use_avpf=yes
rewrite_contact=yes
force_rport=yes
rtp_symmetric=yes
direct_media=no
aors=kartik
auth=kartik
callerid=Kartik <1002>

[kartik]
type=auth
auth_type=userpass
username=kartik
password=1234

[kartik]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=30

; ---- WebRTC browser user: 1001 ----

[1001]
type=endpoint
transport=transport-ws
context=from-webrtc
disallow=all
allow=ulaw
webrtc=yes
dtls_auto_generate_cert=yes
dtls_verify=no
dtls_setup=actpass
media_encryption=dtls
ice_support=yes
media_use_received_transport=yes
rtcp_mux=yes
use_avpf=yes
rewrite_contact=yes
force_rport=yes
rtp_symmetric=yes
direct_media=no
aors=1001
auth=1001
callerid=LocalUser <1001>

[1001]
type=auth
auth_type=userpass
username=1001
password=1234

[1001]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=30
