# =============================================================
# coturn (TURN server) Configuration
# Relays WebRTC audio through NAT/firewalls.
# Copy to /etc/turnserver.conf with root privileges.
#
# Replace before use:
#   ${PUBLIC_IP}  -> your static public IP
#   ${PRIVATE_IP} -> your LAN/private IP (auto-detected by setup script)
# =============================================================

# Listening ports
listening-port=3478
tls-listening-port=5349

# Authentication: static username/password (prototype)
# Must match VITE_TURN_USERNAME / VITE_TURN_PASSWORD in frontend
lt-cred-mech
user=webrtc-user:WebRTC@2024!

# Realm (use IP since we have no domain)
realm=${PUBLIC_IP}

# Fingerprint for STUN messages
fingerprint

# TLS certificate (reuse same self-signed cert as Asterisk)
cert=/etc/asterisk/tls/asterisk.crt
pkey=/etc/asterisk/tls/asterisk.key

# NAT mapping
external-ip=${PUBLIC_IP}
relay-ip=${PRIVATE_IP}

# Relay port range (must be open in firewall)
min-port=49152
max-port=65535

# Quotas
total-quota=200
bps-capacity=0
stale-nonce=600

# Security: block multicast and loopback relay
no-multicast-peers
no-loopback-peers

# Disable CLI (not needed for prototype)
no-cli

# Logging
log-file=/var/log/turnserver/turn.log
simple-log
verbose
