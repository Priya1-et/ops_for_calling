# Copy to /etc/turnserver.conf with root privileges.
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=${TURN_STATIC_AUTH_SECRET}
realm=${PUBLIC_FQDN}
total-quota=200
bps-capacity=0
stale-nonce=600
no-cli
no-multicast-peers
no-loopback-peers
cert=/etc/letsencrypt/live/${PUBLIC_FQDN}/fullchain.pem
pkey=/etc/letsencrypt/live/${PUBLIC_FQDN}/privkey.pem
log-file=/var/log/turnserver/turn.log
simple-log
verbose
external-ip=${PUBLIC_IP}
relay-ip=${PRIVATE_IP}
min-port=49152
max-port=65535
